# Doxyfile for LibLL
PROJECT_NAME           = "LibLL"
PROJECT_NUMBER         = "0.1.0"
PROJECT_BRIEF          = "Embedded circular doubly-linked lists for C (intrusive)"
OUTPUT_DIRECTORY       = ./
CREATE_SUBDIRS         = NO

INPUT                  = LibLL.h LibLL.c docs/mainpage.md
FILE_PATTERNS          = *.h *.c *.md
RECURSIVE              = NO
EXCLUDE_PATTERNS       = */gtest/* */build/* */examples/*
USE_MDFILE_AS_MAINPAGE = docs/mainpage.md

OPTIMIZE_OUTPUT_FOR_C  = YES
EXTRACT_ALL            = NO
EXTRACT_STATIC         = NO
EXTRACT_LOCAL_CLASSES  = YES
HIDE_UNDOC_MEMBERS     = NO
HIDE_UNDOC_CLASSES     = NO

ENABLE_PREPROCESSING   = YES
MACRO_EXPANSION        = YES
EXPAND_ONLY_PREDEF     = YES
SKIP_FUNCTION_MACROS   = NO
PREDEFINED             =

WARNINGS               = YES
WARN_IF_UNDOCUMENTED   = YES
WARN_IF_DOC_ERROR      = YES
WARN_NO_PARAMDOC       = YES
WARN_AS_ERROR          = YES
QUIET                  = YES
EXCLUDE_SYMBOLS        = DEBUG_PRINT \
                         _CRT_SECURE_NO_WARNINGS \
                         LIBLL_H

GENERATE_HTML          = YES
HTML_OUTPUT            = docs
GENERATE_TREEVIEW      = YES
DISABLE_INDEX          = NO
FULL_SIDEBAR           = NO
GENERATE_LATEX         = NO
GENERATE_XML           = NO

HTML_COLORSTYLE        = LIGHT
HTML_HEADER            = docs/doxygen-awesome/header.html
HTML_EXTRA_STYLESHEET  = docs/doxygen-awesome/doxygen-awesome.css \
                         docs/doxygen-awesome/doxygen-awesome-sidebar-only.css \
                         docs/doxygen-awesome/doxygen-awesome-sidebar-only-darkmode-toggle.css
HTML_EXTRA_FILES       = docs/doxygen-awesome/doxygen-awesome-darkmode-toggle.js \
                         docs/doxygen-awesome/doxygen-awesome-fragment-copy-button.js \
                         docs/doxygen-awesome/doxygen-awesome-paragraph-link.js \
                         docs/doxygen-awesome/doxygen-awesome-interactive-toc.js

ABBREVIATE_BRIEF       = YES
JAVADOC_AUTOBRIEF      = YES
TAB_SIZE               = 4
TYPEDEF_HIDES_STRUCT   = YES
SORT_MEMBER_DOCS       = NO
SHOW_FILES             = YES
SHOW_NAMESPACES        = NO

HAVE_DOT               = YES
DOT_IMAGE_FORMAT       = svg
INTERACTIVE_SVG        = YES
CALL_GRAPH             = YES
CALLER_GRAPH           = YES
DIRECTORY_GRAPH        = NO
DOT_GRAPH_MAX_NODES    = 50
MAX_DOT_GRAPH_DEPTH    = 0
